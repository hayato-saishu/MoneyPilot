spring.datasource.url=jdbc:h2:mem:money_pilot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.example.moneyPilot.mybatis

app.jwt.issuer=money-pilot-test
app.jwt.access-token-expiration-seconds=3600
app.jwt.refresh-token-expiration-seconds=2592000
app.jwt.secret=test-secret-key-which-is-at-least-32-bytes-long
